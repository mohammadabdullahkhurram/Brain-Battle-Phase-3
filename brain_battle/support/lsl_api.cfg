; Lab Streaming Layer settings used by Brain Battle (pointed to by the
; LSLAPICFG environment variable, set in brain_battle/capture/clock.py).
; liblsl prints every network interface to the terminal at INFO level; keep
; only real errors.
[log]
level = -2

; Publish over IPv4 only. Every stream then needs 13 open descriptors instead
; of 17 (the app publishes 11 streams), which keeps a recording well under
; macOS's default limit of 256 open files. Programs on the same computer or the
; same network (LabRecorder, LSL viewers) still find the streams as before.
; See docs/decisions/adr-0022-lsl-outlets-open-once.md.
[ports]
IPv6 = disable
